# ==== Cargo.toml ====
[package]
name = "gnome-screenshotter"
version = "0.1.0"
edition = "2021"

[dependencies]
ashpd = "0.13.2"
chrono = "0.4.43"
dirs = "6.0.0"
image = { version = "0.25.9", features = ["avif", "avif-native", "png", "jpeg", "webp"] }
lexopt = "0.3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
